<title>中国三维地形</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D relief model on an atlas-plate ground; title top-left, view buttons top-right, zoom buttons right edge, layer & scale tray along the bottom. */
:root {
  --ground: #dde4e3;
  --ground-2: #cfd8d7;
  --ink: #1f2b2c;
  --muted: #5d6c6b;
  --panel: rgba(246, 249, 248, 0.88);
  --panel-line: rgba(31, 43, 44, 0.12);
  --accent: #2c6e7f;
  --accent-ink: #ffffff;
  --sea-ink: #3c7187;
  --grat: #9aaaa8;
  --wall-bottom: #4a3a2f;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --font-body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #10181a; --ground-2: #172124; --ink: #e2e9e8; --muted: #93a3a1;
    --panel: rgba(20, 30, 32, 0.88); --panel-line: rgba(226, 233, 232, 0.12);
    --accent: #6cb6c7; --accent-ink: #0d1719; --sea-ink: #8fc0d2; --grat: #3b4b4e; --wall-bottom: #1d1611;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #10181a; --ground-2: #172124; --ink: #e2e9e8; --muted: #93a3a1;
  --panel: rgba(20, 30, 32, 0.88); --panel-line: rgba(226, 233, 232, 0.12);
  --accent: #6cb6c7; --accent-ink: #0d1719; --sea-ink: #8fc0d2; --grat: #3b4b4e; --wall-bottom: #1d1611;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 40%, var(--ground-2), var(--ground));
  background-color: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

.lb { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; transform: translate(-9999px, -9999px); }
.lb.region { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.32em; color: #fffdf6;
  text-shadow: 0 0 3px rgba(40, 25, 10, 0.9), 0 1px 6px rgba(40, 25, 10, 0.6); }
.lb.region.big { font-size: 19px; letter-spacing: 0.4em; }
.lb.region.small { font-size: 13px; letter-spacing: 0.2em; }
.lb.country { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: 0.3em; color: #1d2a44;
  text-shadow: 0 0 3px rgba(255, 255, 255, 1), 0 0 7px rgba(255, 255, 255, 0.85); }
.lb.country.minor { font-size: 13.5px; letter-spacing: 0.2em; color: #3a465c; }
.lb.range { font-family: var(--font-display); font-weight: 600; font-size: 12.5px; letter-spacing: 0.18em; color: #3a2414;
  text-shadow: 0 0 3px rgba(255, 246, 228, 0.95), 0 0 6px rgba(255, 246, 228, 0.7); }
.lb.peak { font-size: 12px; color: #2a1a10; font-weight: 600;
  text-shadow: 0 0 3px rgba(255, 250, 240, 1), 0 0 6px rgba(255, 250, 240, 0.8); }
.lb.peak .tri { color: #8b1d12; font-size: 10px; margin-right: 2px; }
.lb.peak .h { font-family: var(--font-mono); font-weight: 500; font-size: 10.5px; margin-left: 3px; color: #5a3a24; }
.lb.water { font-size: 12px; font-weight: 600; color: #0f4f86; letter-spacing: 0.1em;
  text-shadow: 0 0 3px rgba(240, 250, 255, 1), 0 0 6px rgba(240, 250, 255, 0.8); }
.lb.sea { font-family: var(--font-display); font-size: 14px; letter-spacing: 0.5em; color: var(--sea-ink); opacity: 0.9; }
.lb.isle { font-size: 11.5px; letter-spacing: 0.15em; color: var(--sea-ink); font-weight: 600; }
.lb.prov { font-size: 11px; color: #ffffff; font-weight: 600; letter-spacing: 0.05em;
  text-shadow: 0 0 2px rgba(0, 0, 0, 0.85), 0 0 5px rgba(0, 0, 0, 0.5); }
.lb.city { font-size: 11.5px; color: #1b1b1b; font-weight: 600;
  text-shadow: 0 0 3px rgba(255, 255, 255, 1), 0 0 6px rgba(255, 255, 255, 0.8); }
.lb.city .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #fff; border: 1.5px solid #222; margin-right: 4px; vertical-align: 0; }
.lb.city.cap { font-weight: 700; }
.lb.city.cap .dot { background: #c0392b; border-color: #fff; width: 7px; height: 7px; }
.lb.city.anc { font-family: var(--font-display); font-size: 12.5px; color: #2b1d12; }
.lb.city.anc .dot { border-color: #4a2e1a; }
.lb.city.anc.cap { font-size: 14px; color: #7a1d10; }
.lb.city.anc.cap .dot { background: #b0281a; border: 2px solid #fff6e8; box-shadow: 0 0 0 1px #7a1d10; width: 8px; height: 8px; }
.lb.city.anc.minor { font-size: 11px; font-weight: 600; }
.lb.grid { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.lb.polity { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: 0.18em; color: #1c1612;
  text-shadow: 0 0 3px rgba(250, 245, 234, 1), 0 0 7px rgba(250, 245, 234, 0.9); }
.lb.polity.rival { font-size: 15.5px; }
.lb.polity.protectorate { font-size: 12.5px; font-weight: 600; letter-spacing: 0.1em; }
.lb.polity.neighbor { font-size: 13px; letter-spacing: 0.12em; color: #5a2d18; }

.pl-list { display: flex; flex-wrap: wrap; gap: 5px 12px; max-height: 92px; overflow: auto; }
.pl { appearance: none; border: 0; background: none; padding: 1px 0; color: var(--ink); cursor: pointer; font: 600 12px var(--font-body); display: inline-flex; align-items: center; gap: 5px; }
.pl:hover { color: var(--accent); }
.pl .sw { width: 11px; height: 11px; border-radius: 2px; background: color-mix(in srgb, var(--c) 55%, transparent); border: 1.5px solid var(--c); }
.pl.protectorate .sw { border-style: dashed; background: color-mix(in srgb, var(--c) 30%, transparent); }

.hud { position: fixed; z-index: 5; }
#head { top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); max-width: min(60vw, 440px); pointer-events: none; }
#head h1 { text-shadow: 0 0 4px var(--ground), 0 0 10px var(--ground), 0 0 16px var(--ground); }
#head h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: 0.18em; line-height: 1.2; text-wrap: balance; }

#topright { top: 14px; right: max(16px, env(safe-area-inset-right, 0px)); display: grid; justify-items: end; gap: 8px; }
#viewbtns { display: flex; gap: 8px; }
#hints { pointer-events: none; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; padding: 6px 11px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 11.5px; line-height: 1.7; }
#hints dl { margin: 0; display: grid; grid-template-columns: auto auto; column-gap: 10px; }
#hints dt { font-weight: 600; color: var(--ink); text-align: right; }
#hints dd { margin: 0; color: var(--muted); }
#hints .hint-touch { display: none; }
@media (hover: none) and (pointer: coarse) { #hints .hint-mouse { display: none; } #hints .hint-touch { display: grid; } }
.btn { appearance: none; border: 1px solid var(--panel-line); background: var(--panel); color: var(--ink);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  font: 600 12.5px var(--font-body); padding: 8px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .chip:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn svg { width: 14px; height: 14px; }
#zoombtns { right: max(16px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); display: grid; gap: 6px; }
#zoombtns .btn { width: 38px; height: 38px; padding: 0; justify-content: center; font-size: 18px; line-height: 1; }

#tray { left: 0; right: 0; bottom: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px; pointer-events: none; }
.card { pointer-events: auto; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); padding: 10px 12px; min-width: 0; }
.card h2 { margin: 0 0 7px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em; color: var(--muted); }

#legend { width: min(310px, 100%); }
.ramp { height: 10px; border-radius: 3px; }
.ticks { position: relative; height: 15px; font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ticks span { position: absolute; top: 3px; transform: translateX(-50%); }
.ticks span:first-child { transform: none; }
.ticks span:last-child { transform: translateX(-100%); }
.legend-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; margin-top: 4px; font-size: 10.5px; color: var(--muted); }
.legend-foot .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
#note { font-size: 10.5px; color: var(--muted); line-height: 1.5; margin-top: 6px; max-width: 48ch; }
#note a { color: var(--accent); }

#controls { display: grid; gap: 9px; width: min(440px, 100%); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; border: 1px solid var(--panel-line); background: transparent; color: var(--ink); cursor: pointer;
  font: 600 12px var(--font-body); padding: 6px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; opacity: 0.55; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.chip[aria-pressed="true"]::before { background: currentColor; opacity: 1; }
.slider { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.slider output { font-family: var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }
input[type=range] { width: 100%; accent-color: var(--accent); }

#timeline { flex: 1 1 380px; max-width: 760px; display: grid; gap: 7px; }
.tl-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.tl-head b { font-family: var(--font-display); font-size: 18px; letter-spacing: 0.14em; }
.tl-head .num { font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tl-head .seat { font-size: 11.5px; color: var(--muted); }
.tl-row { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 8px; }
.tl-row .btn { width: 30px; height: 30px; padding: 0; justify-content: center; font-size: 15px; }
.tl-track { position: relative; padding-top: 15px; }
.tl-bands { position: absolute; left: 0; right: 0; top: 0; height: 12px; border-radius: 3px; overflow: hidden; }
.tl-band { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--panel); cursor: pointer; opacity: 0.8;
  font-size: 9.5px; line-height: 12px; color: #fff; text-align: center; overflow: hidden; white-space: nowrap; }
.tl-band.cur { opacity: 1; box-shadow: inset 0 0 0 1.5px var(--ink); }
.tl-track input[type=range] { display: block; margin: 0; }
#tlNote { font-size: 11.5px; color: var(--muted); line-height: 1.5; min-height: 1.5em; }

#readout { left: 50%; transform: translateX(-50%); bottom: calc(176px + env(safe-area-inset-bottom, 0px)); pointer-events: none;
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: 999px; padding: 6px 14px; font-size: 12.5px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
#readout b { font-weight: 700; }
#readout .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
#status { left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 13px; color: var(--muted); background: var(--panel);
  border: 1px solid var(--panel-line); border-radius: 12px; padding: 10px 16px; }

@media (max-width: 640px) {
  #head h1 { font-size: 19px; }
  #hints { font-size: 11px; padding: 4px 9px; }
  #tray { flex-direction: column-reverse; align-items: stretch; }
  #legend, #controls { width: 100%; }
  #readout { bottom: calc(250px + env(safe-area-inset-bottom, 0px)); }
  .lb.region { font-size: 13px; letter-spacing: 0.22em; }
  .lb.region.big { font-size: 16px; }
  .lb.country { font-size: 15px; }
  .lb.range { font-size: 11px; }
  #note { display: none; }
  #zoombtns { top: auto; transform: none; bottom: calc(262px + env(safe-area-inset-bottom, 0px)); }
  #timeline { flex: none; max-width: none; }
  #viewbtns { gap: 6px; }
  #viewbtns .lbl { display: none; }
  #viewbtns .btn { padding: 8px 10px; }
  #head { max-width: calc(100vw - 210px); }
  body.hist #legend { display: none; }
  body.hist #readout { bottom: calc(280px + env(safe-area-inset-bottom, 0px)); }
  body.hist #zoombtns { bottom: calc(292px + env(safe-area-inset-bottom, 0px)); }
}
</style>

<div id="stage" aria-label="可旋转缩放的中国及周边三维地形模型"></div>
<div id="labels" aria-hidden="true"></div>

<header id="head" class="hud">
  <h1>中国三维地形</h1>
</header>

<div id="topright" class="hud">
<div id="viewbtns">
  <button class="btn" id="histBtn" aria-pressed="true" type="button">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.6"/></svg>历代疆域</button>
  <button class="btn" id="spin" aria-pressed="false" type="button" aria-label="自动旋转">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M12.4 1.6v2.8H9.6"/></svg><span class="lbl">自动旋转</span></button>
  <button class="btn" id="reset" type="button" aria-label="复位">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.5"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3"/></svg><span class="lbl">复位</span></button>
</div>
<div id="hints" aria-label="操作说明">
  <dl class="hint-mouse">
    <dt>左键拖动</dt><dd>平移</dd>
    <dt>滚轮</dt><dd>在指针处缩放</dd>
    <dt>双击</dt><dd>放大</dd>
    <dt>右键 / Shift+拖动</dt><dd>旋转</dd>
    <dt>点地形</dt><dd>查海拔与归属</dd>
  </dl>
  <dl class="hint-touch">
    <dt>单指拖动</dt><dd>平移</dd>
    <dt>双指捏合</dt><dd>缩放</dd>
    <dt>双指拖动</dt><dd>旋转</dd>
    <dt>轻点</dt><dd>查海拔与归属</dd>
  </dl>
</div>
</div>
<div id="zoombtns" class="hud">
  <button class="btn" id="zin" type="button" aria-label="放大">+</button>
  <button class="btn" id="zout" type="button" aria-label="缩小">−</button>
</div>

<div id="readout" class="hud" hidden></div>
<div id="status" class="hud">正在构建地形…</div>

<div id="tray" class="hud">
  <div id="legend" class="card">
    <div id="elevLegend">
    <h2>海拔（米）</h2>
    <div class="ramp" id="ramp"></div>
    <div class="ticks" id="ticks"></div>
    <div class="legend-foot">
      <span><span class="sw" style="background:#4f8fc0"></span>湖泊</span>
      <span><span class="sw" style="background:#b9b6a6"></span>邻国（色调略淡）</span>
      <span><span class="sw" style="background:linear-gradient(#ee8fb0,#ee8fb0) padding-box;border-top:2px dashed #5c1238;height:6px;border-radius:0"></span>国界</span>
      <span>▲ 山峰 · 米</span>
    </div>
    </div>
    <div id="polLegend" class="pl-list" hidden></div>
    <div id="note">高程来自 NASA 全球地形数据（约 9 公里网格），近看时的细部起伏按当地起伏度程序生成，仅作示意。省界、国界据 ECharts 地图数据；历代疆域受 <a href="https://github.com/DeanChensj/jiangshan-map" target="_blank" rel="noopener">jiangshan-map（江山时序）</a>启发并取自其数据，为示意性复原。</div>
  </div>
  <div id="timeline" class="card" hidden>
    <div class="tl-head"><b id="tlEra"></b><span class="num" id="tlYear"></span><span class="seat" id="tlSeat"></span></div>
    <div class="tl-row">
      <button class="btn" id="tlPrev" type="button" aria-label="上一阶段">‹</button>
      <button class="btn" id="tlNext" type="button" aria-label="下一阶段">›</button>
      <div class="tl-track"><div class="tl-bands" id="tlBands"></div>
        <input type="range" id="tlYearIn" min="-403" max="2026" step="1" value="741" aria-label="年份"></div>
      <button class="btn" id="tlPlay" type="button" aria-label="自动播放" aria-pressed="false">▶</button>
    </div>
    <div id="tlNote"></div>
  </div>
  <div id="controls" class="card">
    <div class="chips" role="group" aria-label="图层">
      <button class="chip" type="button" data-layer="territory" data-mode="hist" aria-pressed="true">疆域</button>
      <button class="chip" type="button" data-layer="ancient" data-mode="hist" aria-pressed="true">古城</button>
      <button class="chip" type="button" data-layer="region" aria-pressed="true">地形区</button>
      <button class="chip" type="button" data-layer="range" aria-pressed="true">山脉</button>
      <button class="chip" type="button" data-layer="peak" aria-pressed="true">山峰</button>
      <button class="chip" type="button" data-layer="water" aria-pressed="true">河湖海</button>
      <button class="chip" type="button" data-layer="city" data-mode="modern" aria-pressed="true">城市</button>
      <button class="chip" type="button" data-layer="country" data-mode="modern" aria-pressed="true">国名</button>
      <button class="chip" type="button" data-layer="nborder" data-mode="modern" aria-pressed="true">国界</button>
      <button class="chip" type="button" data-layer="border" data-mode="modern" aria-pressed="true">省界</button>
      <button class="chip" type="button" data-layer="prov" data-mode="modern" aria-pressed="false">省名</button>
    </div>
    <label class="slider" for="exag">垂直夸张
      <input type="range" id="exag" min="5" max="45" step="1" value="20">
      <output id="exagOut" for="exag">×20</output>
    </label>
  </div>
</div>

<script id="terrain-data" type="application/json">__TERRAIN__</script>
<script id="history-data" type="application/json">__HISTORY__</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  "use strict";
  var statusEl = document.getElementById("status");
  if (!window.THREE || !THREE.OrbitControls) { statusEl.textContent = "三维引擎未能加载，请刷新重试。"; return; }

  var DATA = JSON.parse(document.getElementById("terrain-data").textContent);
  var NX = DATA.nx, NY = DATA.ny, LON0 = DATA.lon0, LAT1 = DATA.lat1, RES = DATA.res, NPROV = DATA.nprov;
  var LON1 = LON0 + (NX - 1) * RES, LAT0 = LAT1 - (NY - 1) * RES;
  var LONC = 104.25, LATC = 35.75;                      // China's centre is the world origin
  var KX = 111.32 * Math.cos(35 * Math.PI / 180) / 10;  // world units per degree lon (1 unit = 10 km)
  var KZ = 111.32 / 10;
  var BASE_Y = -3.2;
  var exag = 20;
  var isTouch = window.matchMedia("(pointer: coarse)").matches;

  // ---------- hypsometric ramp (metres) ----------
  var STOPS = [[0, "#4e9660"], [150, "#7fb766"], [400, "#c4d488"], [800, "#e6cf86"], [1500, "#dcae68"], [2500, "#c28450"],
               [3500, "#a1633b"], [4300, "#8a5434"], [5000, "#7d5040"], [5600, "#a99a92"], [6200, "#ece8e3"], [9000, "#ffffff"]];

  function scheduleUrl() {
    clearTimeout(urlTimer);
    urlTimer = setTimeout(function () {
      try {
        var u = new URL(location.href);
        if (hist.on) { u.searchParams.set("year", hist.year); u.searchParams.delete("mode"); }
        else { u.searchParams.delete("year"); u.searchParams.set("mode", "modern"); }
        history.replaceState(null, "", u);
      } catch (e) { /* file:// or sandboxed frames */ }
    }, 400);
  }
  function initHistory() {
    var q = new URLSearchParams(location.search), y = parseInt(q.get("year"), 10);
    buildTimeline(); buildSettlements();
    setYear(isFinite(y) ? y : hist.year);
    setHist(q.get("mode") !== "modern");
  }

  // ---------- UI ----------
  var spinBtn = document.getElementById("spin");
  function stopSpin() { if (controls.autoRotate) { controls.autoRotate = false; spinBtn.setAttribute("aria-pressed", "false"); } }
  spinBtn.addEventListener("click", function () {
    controls.autoRotate = !controls.autoRotate; spinBtn.setAttribute("aria-pressed", String(controls.autoRotate));
  });
  document.getElementById("reset").addEventListener("click", function () { homeView(); });
  document.querySelectorAll(".chip").forEach(function (b) {
    b.addEventListener("click", function () {
      var k = b.dataset.layer, on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", String(on)); layerOn[k] = on;
      applyLayers();
    });
  });
  var exagIn = document.getElementById("exag"), exagOut = document.getElementById("exagOut"), exagPending = false;
  exagIn.addEventListener("input", function () {
    exag = +exagIn.value; exagOut.textContent = "×" + exag;
    if (exagPending || !H) return; exagPending = true;
    requestAnimationFrame(function () { exagPending = false; applyExaggeration(); });
  });

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); dirty = true;
  }
  window.addEventListener("resize", resize);
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  (mq.addEventListener ? mq.addEventListener("change", themeColors) : mq.addListener(themeColors));
  new MutationObserver(themeColors).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  var dirty = true;
  controls.addEventListener("change", function () { dirty = true; lastMove = performance.now(); });

  function loop() {
    requestAnimationFrame(loop);
    stepFly(performance.now());
    var moved = controls.update();
    clampTarget();
    var now = performance.now();
    maybeUpdatePatch(now);
    updateRibbonsForZoom();
    if (dirty || moved || controls.autoRotate) { renderer.render(scene, camera); placeLabels(); dirty = false; }
  }

  // ---------- boot ----------
  resize();
  Promise.all([unpack(DATA.h), unpack(DATA.region), unpack(DATA.relief), unpack(HIST.shapes)]).then(function (res) {
    var u16 = new Uint16Array(res[0]);
    H = new Float32Array(NX * NY); WATER = new Uint8Array(NX * NY);
    for (var k = 0; k < u16.length; k++) { var v = u16[k]; WATER[k] = v & 0x8000 ? 1 : 0; H[k] = (v & 0x7fff) - 500; }
    REGION = new Uint8Array(res[1]); RELIEF = new Uint8Array(res[2]);
    buildCells();
    buildTerrain();
    DATA.rivers.forEach(function (r) { addRiver(r.path, r.w === 3 ? 0.42 : r.w === 2 ? 0.32 : 0.2); });
    addLines(DATA.prov, "border", 0xffffff, 0.5, 0.06);
    addBorderRibbons(DATA.borders, "nborder", 7, 1.8, 0xf2a7c0, 0.5, 0x6b2147, 18);
    addBorderRibbons(DATA.cnborder, "nborder", 11, 3, 0xee8fb0, 0.6, 0x5c1238, 24);
    buildLabels();
    addGraticule();
    decodeShapes(res[3]); initHistTexture(); initHistory();
    themeColors();
    applyExaggeration();
    homeView();
    statusEl.hidden = true;
    window.__terrainReady = true;
    loop();
  }).catch(function (err) {
    statusEl.textContent = "地形数据解码失败：" + (err && err.message ? err.message : err);
  });

  // test hook (harmless for viewers)
  window.__view = function (lon, lat, dist, polarDeg, azDeg) {
    var t = new THREE.Vector3(lonToX(lon), 0, latToZ(lat)), pol = (polarDeg || 45) * Math.PI / 180, az = (azDeg || 0) * Math.PI / 180;
    controls.target.copy(t);
    camera.position.set(t.x + Math.sin(pol) * Math.sin(az) * dist, Math.cos(pol) * dist, t.z + Math.sin(pol) * Math.cos(az) * dist);
    controls.update(); lastMove = 0; lastPatchCheck = 0; maybeUpdatePatch(performance.now() + 1000); dirty = true;
  };
  window.__year = function (y) { if (y == null) { setHist(false); return; } setHist(true); setYear(y); };
})();
</script>
